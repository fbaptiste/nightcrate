[package]
name = "nightcrate-shell"
version = "0.53.0"
description = "NightCrate desktop shell"
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[features]
default = []
test-devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["dynamic-acl"] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
